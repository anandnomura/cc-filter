name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  binaries:
    name: Build ${{ matrix.component }} ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [bap-edge, bap-service]
        goos: [linux, windows]
        goarch: [amd64, arm64]
        exclude:
          - component: bap-service
            goos: windows
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true

      - name: Test
        run: go test -mod=vendor ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -eu
          package="./bap-edge/cmd"
          if [ "${{ matrix.component }}" = "bap-service" ]; then package="./bap-service/cmd"; fi
          suffix=""
          if [ "${{ matrix.goos }}" = "windows" ]; then suffix=".exe"; fi
          output="${{ matrix.component }}-${{ matrix.goos }}-${{ matrix.goarch }}${suffix}"
          go build -mod=vendor -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "${output}" "${package}"
          sha256sum "${output}" > "${output}.sha256"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: '${{ matrix.component }}-${{ matrix.goos }}-${{ matrix.goarch }}*'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ matrix.component }}-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: Publish release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bap-edge-*
            bap-service-*
